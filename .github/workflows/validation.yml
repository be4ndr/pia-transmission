name: Validation
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Install host prerequisites and pinned Gitleaks
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc jq
          GOBIN="$RUNNER_TEMP/bin" go install github.com/zricethezav/gitleaks/v8@v8.30.1
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Scan working tree, index and history
        run: |
          python3 scripts/scan-secrets.py working
          python3 scripts/scan-secrets.py staged
          python3 scripts/scan-secrets.py history
      - name: Host regressions and static checks
        run: |
          python3 -m unittest discover -s tests -v
          python3 -m compileall -q runtime tests scripts
          for script in runtime/*.sh; do sh -n "$script"; done
          docker compose --env-file .env.example config -q
          git diff --check
